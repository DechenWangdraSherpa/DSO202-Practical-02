# =============================================================================
# File        : cluster/kind-cluster-fallback.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Same three-node cluster as Listing 1, without the node-name
#               patches. Node objects keep kind's default names.
# Apply with  : kind create cluster --config cluster/kind-cluster-fallback.yaml
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: dso202-p2

networking:
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  # Node object name will be: dso202-p2-control-plane
  - role: control-plane

  # Node object name will be: dso202-p2-worker
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"
    extraMounts:
      - hostPath: /tmp/dso202-p2-storage
        containerPath: /mnt/dso202-static
        readOnly: false
        selinuxRelabel: false
        propagation: None

  # Node object name will be: dso202-p2-worker2
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=2"
