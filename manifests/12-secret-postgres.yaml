# =============================================================================
# File        : manifests/12-secret-postgres.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Supply the three values the PostgreSQL image needs on first
#               start, without writing them into the StatefulSet.
#
# WARNING     : A Secret is base64-ENCODED, not encrypted. Any account able to
#               read Secrets in this namespace can recover these values with a
#               single command, and this file in Git is plaintext to anyone who
#               can read the repository.
#               Committing it is acceptable ONLY because this cluster is local,
#               disposable, and holds nothing of value. Restricting who may
#               read Secrets is RBAC (Unit II 2.3); keeping real credentials
#               out of Git is addressed by the tooling in Unit III.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: dso202-practical-02
  labels:
    app: postgres
    tier: database
    dso202/practical: "02"
    dso202/managed-by: declarative

# Opaque is the general-purpose type. Other types exist for specific shapes of
# data, for example kubernetes.io/tls and kubernetes.io/dockerconfigjson, and
# the API server validates the required keys of those types.
type: Opaque

# stringData accepts plain text and the API server encodes it. The alternative
# field, 'data', requires values that are already base64, which is a common
# source of errors caused by a trailing newline inside the encoded value.
stringData:
  # These three key names are fixed by the PostgreSQL image and cannot be
  # renamed. The image reads POSTGRES_*; an application container beside it
  # would typically read DB_HOST, DB_USER and similar. Mapping one set of names
  # to the other is the responsibility of the application manifest, and getting
  # it wrong is the single most common cause of a database that starts
  # correctly while the application cannot connect to it.
  POSTGRES_DB: tasktracker
  POSTGRES_USER: taskuser
  POSTGRES_PASSWORD: dso202-practical-only
