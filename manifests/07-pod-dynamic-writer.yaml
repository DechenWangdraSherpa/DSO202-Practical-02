# =============================================================================
# File        : manifests/07-pod-dynamic-writer.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Become the 'first consumer' the binding mode is waiting for.
#               Applying this Pod is what causes the volume to be created.
# Apply with  : kubectl apply -f manifests/07-pod-dynamic-writer.yaml
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-writer
  namespace: dso202-practical-02
  labels:
    app: dynamic-writer
    tier: storage-demo
    dso202/practical: "02"
    dso202/managed-by: declarative
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  containers:
    - name: writer
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) start pod=${POD_NAME} node=${NODE_NAME}" >> /data/ledger.txt
          exec sleep infinity
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-data
